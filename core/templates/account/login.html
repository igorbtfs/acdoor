{% extends "base.html" %}
{% load socialaccount %}

{% block content %}
<div class="login-box">
    <h1>Faça seu login</h1>
    <p>Use sua conta institucional do Google (@restinga.ifrs.edu.br ou @aluno.restinga.ifrs.edu.br).</p>

    {# Enviar por POST leva direto ao Google, sem a tela intermediária "Continuar". #}
    <form method="post" action="{% provider_login_url 'google' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-google">Login com Google</button>
    </form>
</div>
{% endblock %}
