{% extends "base.html" %}

{% block titulo %}Sair{% endblock %}
{% block classe_main %}estreito{% endblock %}

{% block content %}
<div class="entrada">
    <h1>Sair do AC-Door</h1>
    <p>Você tem certeza que deseja sair?</p>
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sair</button>
    </form>
</div>
{% endblock %}
